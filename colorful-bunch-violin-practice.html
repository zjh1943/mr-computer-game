<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorful Bunch · 原版角色五线谱</title>
  <style>
    :root{font-family:system-ui,"Noto Sans SC",sans-serif;color:#211a14;background:#d7d0c3}body{margin:0;padding:24px;box-sizing:border-box;background:linear-gradient(135deg,#d4e1f5,#e9cfac)}main{margin:auto;max-width:1040px;padding:clamp(20px,5vw,58px);background:#fffdf7;box-shadow:0 20px 70px #47372166}h1{margin:0;text-align:center;font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(30px,5vw,52px)}.subtitle{max-width:44rem;margin:14px auto 24px;text-align:center;line-height:1.7;color:#665a4d}.player{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px 18px;border:1px solid #d6b77f;background:#fff1d7}.player strong{color:#8e362c}.player audio{width:100%}.legend{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.tag{padding:5px 10px;border-radius:999px;background:#e8efff;color:#244b9f;font-size:14px}.tag.cue{background:#ffe5d8;color:#a4401d}.tip{padding:12px 15px;border-left:5px solid #c84f42;background:#fff4df;line-height:1.65}.system{break-inside:avoid;margin:30px 0}.system-head{display:flex;justify-content:space-between;gap:16px;margin:0 7px 6px;font-size:14px}.system-head b{color:#5d4432}.role-cue{margin:4px 7px 0;color:#a4401d;font-size:13px;font-weight:700}.score{display:block;width:100%;height:auto;overflow:visible}.staff{fill:none;stroke:#211a14;stroke-width:1.35}.bar{stroke:#211a14;stroke-width:1.3}.note{stroke:#211a14;stroke-width:.7}.player-note{fill:#315dbc}.stem{stroke:#211a14;stroke-width:1.5}.hold{stroke-width:5;stroke-linecap:round;opacity:.8}.clef{font:54px Georgia,serif}.footer{margin-top:34px;padding-top:16px;border-top:1px solid #d7cabc;color:#665a4d;line-height:1.65;font-size:14px}@media print{body{padding:0;background:#fff}main{box-shadow:none;max-width:none}.player{display:none}.system{page-break-inside:avoid}}
  </style>
</head>
<body>
  <main data-duration="262" data-full-track="true">
    <h1>Colorful Bunch · 原版角色五线谱</h1>
    <p class="subtitle">西蒙独奏预览：完整保留 4 分 22 秒的原曲播放，只把西蒙的原版演唱音符写进五线谱。</p>
    <section class="player" aria-label="Colorful Bunch 完整原曲播放器"><strong>完整原曲</strong><audio controls preload="metadata" src="./assets/dance-reference/colorful-bunch.ogg">你的浏览器不能播放音频。</audio></section>
    <div class="legend"><span class="tag">蓝色音符：西蒙</span><span class="tag cue">橙色文字：其他正在演唱的角色名字</span></div>
    <p class="tip">五线谱不是随机音符：西蒙的每一颗音符都来自原版关卡的实际落点；横向位置是原曲时间，竖向位置对应原版四方向演唱音位，粗线表示原版长按。</p>
    <section id="score" aria-label="Colorful Bunch 完整原版角色五线谱"></section>
    <p class="footer">完整原曲，不剪短。谱面只保留角色演唱和接拍内容，不另外添加背景伴奏音符。</p>
  </main>
  <script src="dance-reference-data.js"></script>
  <script>
    const track=window.DanceReferenceData.tracks.find(item=>item.id==='reference-colorful-bunch');
    const score=document.querySelector('#score'),duration=track.duration,bpm=track.bpm,barSeconds=60/bpm*4,barsPerSystem=4;
    const laneY=[90,76,62,48],names={oren:'奥伦',raddy:'瑞迪',clukr:'克拉克',vineria:'维内里亚',funbot:'快乐机器人',gray:'小灰人',brud:'布鲁德',lime:'莱姆',garnold:'加诺德',sky:'天空',mr_sun:'太阳公公',durple:'德普勒',mr_tree:'大树先生',tunner:'图纳',computer:'电脑先生',wenda:'温达',pinki:'平吉',jevin:'杰文'};
    const activeCharacter=(side,time)=>{const changes=track.events.filter(event=>event.side===side&&event.time<=time&&event.character);const character=changes.length?changes.at(-1).character:track.initial[side];return names[character]||character};
    const minutes=value=>`${Math.floor(value/60)}:${String(Math.floor(value%60)).padStart(2,'0')}`;
    for(let start=0,system=0;start<duration;start+=barSeconds*barsPerSystem,system++){
      const end=Math.min(duration,start+barSeconds*barsPerSystem),allNotes=track.notes.filter(note=>note.time>=start&&note.time<end&&note.animate!==false),notes=allNotes.filter(note=>note.side==='player'&&note.hit===true),otherNames=[...new Set(allNotes.filter(note=>note.side!=='player').map(note=>activeCharacter(note.side,note.time)).filter(Boolean))];
      const section=document.createElement('section');section.className='system';section.innerHTML=`<div class="system-head"><b>第 ${system+1} 段 · 西蒙独奏</b><span>${minutes(start)} – ${minutes(end)}</span></div>${otherNames.length?`<p class="role-cue">其他角色演唱：${otherNames.join('、')}</p>`:''}`;
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','score');svg.setAttribute('viewBox','0 0 960 140');svg.setAttribute('role','img');svg.setAttribute('aria-label',`第 ${system+1} 段原版角色谱面`);
      const staff=document.createElementNS(svg.namespaceURI,'path');staff.setAttribute('class','staff');staff.setAttribute('d','M62 46H930M62 60H930M62 74H930M62 88H930M62 102H930');svg.append(staff);
      const clef=document.createElementNS(svg.namespaceURI,'text');clef.setAttribute('class','clef');clef.setAttribute('x','10');clef.setAttribute('y','102');clef.textContent='𝄞';svg.append(clef);
      for(let bar=0;bar<=barsPerSystem;bar++){const line=document.createElementNS(svg.namespaceURI,'line');const x=62+bar*217;line.setAttribute('class','bar');line.setAttribute('x1',x);line.setAttribute('x2',x);line.setAttribute('y1','46');line.setAttribute('y2','102');svg.append(line)}
      for(const note of notes){const x=62+(note.time-start)/(end-start)*868,lane=Math.abs(note.lane)%4,y=laneY[lane];if(note.hold>0){const hold=document.createElementNS(svg.namespaceURI,'line');hold.setAttribute('class','hold player-note');hold.setAttribute('x1',x+6);hold.setAttribute('x2',Math.min(928,x+note.hold/(end-start)*868));hold.setAttribute('y1',y);hold.setAttribute('y2',y);svg.append(hold)}const head=document.createElementNS(svg.namespaceURI,'ellipse');head.setAttribute('class','note player-note');head.setAttribute('cx',x);head.setAttribute('cy',y);head.setAttribute('rx','6');head.setAttribute('ry','4.4');head.setAttribute('transform',`rotate(-18 ${x} ${y})`);svg.append(head);const stem=document.createElementNS(svg.namespaceURI,'line');stem.setAttribute('class','stem');stem.setAttribute('x1',x+5);stem.setAttribute('x2',x+5);stem.setAttribute('y1',y);stem.setAttribute('y2',y-29);svg.append(stem)}
      section.append(svg);score.append(section);
    }
  </script>
</body>
</html>
