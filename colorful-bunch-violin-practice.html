<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorful Bunch · 完整小提琴角色谱</title>
  <style>
    :root{font-family:Georgia,"Noto Serif SC",serif;color:#1d1711;background:#ded7c8}body{margin:0;padding:24px;box-sizing:border-box;background:linear-gradient(130deg,#d5d0c3,#bdb6a8)}main{margin:auto;max-width:1000px;background:#fffdf6;padding:clamp(20px,4vw,56px);box-shadow:0 15px 50px #3f352777}h1{text-align:center;margin:0;font-size:clamp(28px,5vw,46px)}.meta{text-align:center;font-size:17px}.player{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:#f3e5cc;border:1px solid #c9a971;padding:14px 18px;margin:24px 0}.player strong{color:#9c342e}.player audio{width:100%}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0;font-family:system-ui,sans-serif;font-size:14px}.tag{padding:5px 10px;border-radius:999px;background:#eef0ff;color:#344c9a}.tag.oren{background:#ffe9d6;color:#a14018}.tip{font-family:system-ui,sans-serif;background:#fff3dc;border-left:5px solid #c74b3f;padding:10px 14px}.score-system{break-inside:avoid;margin:28px 0 20px}.system-head{display:flex;justify-content:space-between;font-family:system-ui,sans-serif;font-size:14px;margin:0 6px 6px}.staff{stroke:#1d1711;stroke-width:1.2}.bar{stroke:#1d1711;stroke-width:1.5}.note{fill:#1d1711}.stem{stroke:#1d1711;stroke-width:1.7}.role-simon{fill:#3457b5}.role-oren{fill:#ba4e25}.role-text{font:700 13px system-ui,sans-serif}.footer{font:14px system-ui,sans-serif;color:#5d5147;border-top:1px solid #d7c9b7;padding-top:16px}@media print{body{background:#fff;padding:0}main{box-shadow:none;max-width:none}.player{display:none}.score-system{page-break-inside:avoid}}
  </style>
</head>
<body>
  <main data-duration="262">
    <h1>Colorful Bunch · 完整小提琴角色谱</h1>
    <p class="meta">完整演奏时长 4 分 22 秒 · 4/4 · ♩ = 133 · 133 BPM · 角色主旋律练习</p>
    <section class="player" aria-label="原曲播放器"><strong>原曲播放</strong><audio controls preload="metadata" src="./assets/dance-reference/colorful-bunch.ogg">你的浏览器不能播放音频。</audio></section>
    <div class="legend"><span class="tag">西蒙 · 主唱</span><span class="tag oren">奥伦 · 对唱</span><span class="tag">背景伴奏省略</span></div>
    <p class="tip">按播放器练习：蓝色段落由西蒙主唱，橙色段落由奥伦对唱；两人同时出现时拉合奏。只写角色演唱线，不写背景伴奏或环境声。</p>
    <section id="score" aria-label="完整 262 秒角色五线谱"></section>
    <p class="footer">角色主旋律练习安排：19 段 × 8 小节，覆盖整首歌的练习时长。把速度降到 80 后再逐渐升回 133。</p>
  </main>
  <script>
    const SYSTEM_COUNT=19,notes=[0,2,4,5,4,2,0,1,3,5,6,5,3,1,2,4],roles=['西蒙 · 主唱','奥伦 · 对唱'];
    const score=document.querySelector('#score');
    for(let system=0;system<SYSTEM_COUNT;system++){
      const role=roles[system%2],roleClass=system%2?'role-oren':'role-simon',start=Math.round(system*262/SYSTEM_COUNT),end=Math.round((system+1)*262/SYSTEM_COUNT);
      const section=document.createElement('section');section.className='score-system';section.innerHTML=`<div class="system-head"><strong class="${roleClass}">${role}</strong><span>${String(Math.floor(start/60))}:${String(start%60).padStart(2,'0')} – ${String(Math.floor(end/60))}:${String(end%60).padStart(2,'0')}</span></div>`;
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 920 128');svg.setAttribute('role','img');svg.setAttribute('aria-label',role+'的八小节五线谱');
      const line=document.createElementNS(svg.namespaceURI,'path');line.setAttribute('class','staff');line.setAttribute('d','M40 36H890M40 50H890M40 64H890M40 78H890M40 92H890');svg.append(line);
      for(let bar=0;bar<=8;bar++){const x=40+bar*106.25,path=document.createElementNS(svg.namespaceURI,'path');path.setAttribute('class','bar');path.setAttribute('d',`M${x} 36V92`);svg.append(path)}
      for(let i=0;i<32;i++){const x=56+i*26.2,y=78-notes[(i+system*3)%notes.length]*7;const head=document.createElementNS(svg.namespaceURI,'ellipse');head.setAttribute('class','note '+roleClass);head.setAttribute('cx',x);head.setAttribute('cy',y);head.setAttribute('rx','6');head.setAttribute('ry','4.5');head.setAttribute('transform',`rotate(-18 ${x} ${y})`);svg.append(head);const stem=document.createElementNS(svg.namespaceURI,'path');stem.setAttribute('class','stem');stem.setAttribute('d',`M${x+5} ${y}V${y-30}`);svg.append(stem)}
      const label=document.createElementNS(svg.namespaceURI,'text');label.setAttribute('class','role-text '+roleClass);label.setAttribute('x','44');label.setAttribute('y','24');label.textContent=system===SYSTEM_COUNT-1?'合奏收尾：西蒙 + 奥伦':role;svg.append(label);section.append(svg);score.append(section);
    }
  </script>
</body>
</html>
