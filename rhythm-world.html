<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的节奏盒子世界</title><link rel="stylesheet" href="./rhythm-world.css"></head>
<body>
<main id="cover" class="screen cover"><div class="crowd" aria-hidden="true"><img src="assets/town-icons/oren.png"><img src="assets/town-icons/raddy.png"><img src="assets/town-icons/fun-bot.png"><img src="assets/town-icons/pinki.png"><img src="assets/town-icons/simon.png"></div><div class="hero"><small>原创音乐 · 自由小镇 · 创造角色</small><h1>我的<br><span>节奏盒子世界</span></h1><button id="start" class="primary">开始游戏</button><button id="settings">设置</button></div></main>
<section id="settingsPanel" class="modal" hidden><div class="card"><button data-close>×</button><h2>设置</h2><label>语言 <select id="language"><option value="zh">简体中文</option><option value="en">English</option></select></label><p>其他设置以后再添加。</p></div></section>
<section id="slots" class="screen slots" hidden><header><button data-home>‹ 返回</button><b>我的节奏盒子世界</b></header><div class="slot-card"><h2>选择世界</h2><button id="create" class="create"><i>＋</i><b>创建世界</b><small>开始新的音乐冒险</small></button><div class="save"><i>♫</i><b>存档</b><small id="saveText">还没有创建世界</small></div></div></section>
<section id="loading" class="screen loading" hidden><img src="assets/town-icons/fun-bot.png"><h2>世界正在生成</h2><p>《我的节奏盒子世界》正在下载</p><div class="progress"><i id="bar"></i></div><b id="percent">0%</b></section>
<section id="world" class="screen world" hidden><div class="town-sky"><div class="sun">♪</div><div class="cloud a"></div><div class="cloud b"></div></div><header><b>节奏盒子小镇</b><span>💎 120</span><button id="newRole">＋ 添加新角色</button></header><div class="buildings"><button data-place="shop">节拍商店<small>购买房子与家具</small></button><button data-place="home">我的家<small>装修与地下室</small></button><button data-place="stage">音乐广场<small>夜晚大挑战</small></button></div><div id="player" class="player"><img src="assets/town-icons/gray.png" alt="小灰人"></div><button id="bot" class="bot"><em>点击对话</em><img src="assets/town-icons/fun-bot.png" alt="快乐机器人"></button><div id="joystick" class="joystick"><i></i></div><p class="hint">拖动右下角摇杆探索小镇 · 电脑端也可用方向键</p></section>
<section id="dialog" class="modal" hidden><div class="card chat"><button data-close>×</button><img src="assets/town-icons/fun-bot.png"><h2>快乐机器人</h2><p id="botText">嗯，我刚把你生产出来。你是好的吗？先和我说“你好”吧！</p><div class="input"><input id="chatInput" placeholder="键盘输入…"><button id="voice">🎤 语音</button><button id="send">发送</button></div><div id="roles" class="roles" hidden></div></div></section>
<section id="placePanel" class="modal" hidden><div class="card"><button data-close>×</button><h2 id="placeTitle"></h2><div id="placeBody"></div></div></section>
<script src="./rhythm-world.js"></script></body></html>
